<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your MOMENTO</title>

  <!-- Forminit SDK -->
  <script src="https://forminit.com/sdk/v1/forminit.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f3ee;
      color: #222;
      min-height: 100vh;
    }

    .container {
      width: min(700px, 92%);
      margin: auto;
      padding: 45px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 42px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .header p {
      color: #777;
      font-size: 15px;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 15px 45px rgba(0,0,0,.08);
    }

    .field {
      margin-bottom: 22px;
    }

    label.title {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      background: #fff;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #222;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice {
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: block;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    .choice input:checked + label {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: #222;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .success {
      display: none;
      text-align: center;
      padding: 35px 10px;
    }

    .success.active {
      display: block;
    }

    .success h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .success p {
      color: #666;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    .error {
      display: none;
      color: #a33;
      background: #fff1f1;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 0;
      }

      .card {
        padding: 22px;
      }

      .header h1 {
        font-size: 32px;
      }

      .choices {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>MOMENTO</h1>
      <p>Create something made from your memories.</p>
    </header>

    <section class="card">

      <form
        id="momento-form"
        enctype="multipart/form-data"
      >

        <!-- FOR -->
        <div class="field">
          <label class="title" for="for">For *</label>
          <input
            id="for"
            type="text"
            name="fi-text-for"
            placeholder="Who is this MOMENTO for?"
            required
          >
        </div>

        <!-- FROM -->
        <div class="field">
          <label class="title" for="from">From *</label>
          <input
            id="from"
            type="text"
            name="fi-text-from"
            placeholder="Who is it from?"
            required
          >
        </div>

        <!-- OCCASION -->
        <div class="field">
          <label class="title" for="occasion">Occasion *</label>

          <select
            id="occasion"
            name="fi-select-occasion"
            required
          >
            <option value="">Choose an occasion</option>
            <option value="Birthday">Birthday</option>
            <option value="Anniversary">Anniversary</option>
            <option value="Friendship">Friendship</option>
            <option value="Graduation">Graduation</option>
            <option value="Just Because">Just Because</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- VIBE -->
        <div class="field">
          <label class="title">Vibe *</label>

          <div class="choices">

            <div class="choice">
              <input
                id="vibe-soft"
                type="radio"
                name="fi-radio-vibe"
                value="Soft & Romantic"
                required
              >
              <label for="vibe-soft">Soft & Romantic</label>
            </div>

            <div class="choice">
              <input
                id="vibe-fun"
                type="radio"
                name="fi-radio-vibe"
                value="Fun & Playful"
              >
              <label for="vibe-fun">Fun & Playful</label>
            </div>

            <div class="choice">
              <input
                id="vibe-nostalgic"
                type="radio"
                name="fi-radio-vibe"
                value="Nostalgic"
              >
              <label for="vibe-nostalgic">Nostalgic</label>
            </div>

            <div class="choice">
              <input
                id="vibe-minimal"
                type="radio"
                name="fi-radio-vibe"
                value="Minimal & Elegant"
              >
              <label for="vibe-minimal">Minimal & Elegant</label>
            </div>

          </div>
        </div>

        <!-- PACKAGE -->
        <div class="field">
          <label class="title">Package *</label>

          <div class="choices">

            <div class="choice">
              <input
                id="package-basic"
                type="radio"
                name="fi-radio-package"
                value="Basic"
                required
              >
              <label for="package-basic">Basic</label>
            </div>

            <div class="choice">
              <input
                id="package-standard"
                type="radio"
                name="fi-radio-package"
                value="Standard"
              >
              <label for="package-standard">Standard</label>
            </div>

            <div class="choice">
              <input
                id="package-premium"
                type="radio"
                name="fi-radio-package"
                value="Premium"
              >
              <label for="package-premium">Premium</label>
            </div>

            <div class="choice">
              <input
                id="package-custom"
                type="radio"
                name="fi-radio-package"
                value="Custom"
              >
              <label for="package-custom">Custom</label>
            </div>

          </div>
        </div>

        <!-- DELIVERY -->
        <div class="field">
          <label class="title" for="delivery">Delivery *</label>

          <select
            id="delivery"
            name="fi-select-delivery"
            required
          >
            <option value="">Choose delivery method</option>
            <option value="Digital">Digital</option>
            <option value="Physical">Physical</option>
            <option value="Digital + Physical">Digital + Physical</option>
          </select>
        </div>

        <!-- PHOTOS -->
        <div class="field">
          <label class="title" for="photos">Photos *</label>

          <input
            id="photos"
            type="file"
            name="fi-file-photos[]"
            accept="image/*"
            multiple
            required
          >

          <small style="display:block;margin-top:8px;color:#888;">
            Choose the photos you'd like to include in your MOMENTO.
          </small>
        </div>

        <!-- EXTRA MESSAGE -->
        <div class="field">
          <label class="title" for="message">Anything else?</label>

          <textarea
            id="message"
            name="fi-text-message"
            placeholder="Tell us anything you'd like us to know..."
          ></textarea>
        </div>

        <button
          class="submit"
          id="submit-button"
          type="submit"
        >
          Submit request ✦
        </button>

        <div class="error" id="error-message"></div>

      </form>

      <!-- SUCCESS -->
      <div class="success" id="success">

        <h2>Request received ✨</h2>

        <p>
          Your MOMENTO request has been received successfully.
          <br>
          We'll start working on your memory soon.
        </p>

        <a class="back" href="index.html">
          Back to MOMENTO
        </a>

      </div>

    </section>

  </main>

  <script>
    const forminit = new Forminit();
    const FORM_ID = "6qmuru0tvu8";

    const form = document.getElementById("momento-form");
    const button = document.getElementById("submit-button");
    const success = document.getElementById("success");
    const errorMessage = document.getElementById("error-message");

    form.addEventListener("submit", async function (e) {

      e.preventDefault();

      button.disabled = true;
      button.textContent = "Sending…";
      errorMessage.style.display = "none";

      try {

        const formData = new FormData(form);

        const result = await forminit.submit(
          FORM_ID,
          formData
        );

        if (result.error) {
          throw new Error(result.error.message);
        }

        form.style.display = "none";
        success.classList.add("active");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      } catch (error) {

        button.disabled = false;
        button.textContent = "Submit request ✦";

        errorMessage.textContent =
          error.message ||
          "Something went wrong. Please try again.";

        errorMessage.style.display = "block";
      }

    });
  </script>

</body>
  </html>
