<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your MOMENTO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f3ee;
      color: #222;
      min-height: 100vh;
    }

    .container {
      width: min(700px, 92%);
      margin: 0 auto;
      padding: 45px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 42px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .header p {
      color: #777;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 15px 45px rgba(0,0,0,.08);
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #222;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice {
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
      margin: 0;
      font-weight: normal;
      transition: .2s;
    }

    .choice input:checked + label {
      background: #222;
      color: white;
      border-color: #222;
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit:hover {
      opacity: .9;
    }

    .success {
      display: none;
      text-align: center;
      padding: 35px 15px;
    }

    .success.active {
      display: block;
    }

    .success h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .success p {
      color: #666;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    .required {
      color: #a33;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 0;
      }

      .card {
        padding: 22px;
      }

      .header h1 {
        font-size: 32px;
      }

      .choices {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>MOMENTO</h1>
      <p>Create something made from your memories.</p>
    </header>

    <section class="card">

      <form
        name="momento-request"
        method="POST"
        action="/success.html"
        data-netlify="true"
        enctype="multipart/form-data"
      >

        <input type="hidden" name="form-name" value="momento-request">

        <!-- FOR -->
        <div class="field">
          <label for="for">For <span class="required">*</span></label>
          <input
            id="for"
            type="text"
            name="for"
            placeholder="Who is this MOMENTO for?"
            required
          >
        </div>

        <!-- FROM -->
        <div class="field">
          <label for="from">From <span class="required">*</span></label>
          <input
            id="from"
            type="text"
            name="from"
            placeholder="Who is it from?"
            required
          >
        </div>

        <!-- OCCASION -->
        <div class="field">
          <label for="occasion">Occasion <span class="required">*</span></label>

          <select id="occasion" name="occasion" required>
            <option value="">Choose an occasion</option>
            <option value="Birthday">Birthday</option>
            <option value="Anniversary">Anniversary</option>
            <option value="Friendship">Friendship</option>
            <option value="Graduation">Graduation</option>
            <option value="Just Because">Just Because</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- VIBE -->
        <div class="field">
          <label>Vibe <span class="required">*</span></label>

          <div class="choices">

            <div class="choice">
              <input
                type="radio"
                id="vibe-soft"
                name="vibe"
                value="Soft & Romantic"
                required
              >
              <label for="vibe-soft">Soft & Romantic</label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="vibe-fun"
                name="vibe"
                value="Fun & Playful"
              >
              <label for="vibe-fun">Fun & Playful</label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="vibe-nostalgic"
                name="vibe"
                value="Nostalgic"
              >
              <label for="vibe-nostalgic">Nostalgic</label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="vibe-minimal"
                name="vibe"
                value="Minimal & Elegant"
              >
              <label for="vibe-minimal">Minimal & Elegant</label>
            </div>

          </div>
        </div>

        <!-- PACKAGE -->
        <div class="field">
          <label>Package <span class="required">*</span></label>

          <div class="choices">

            <div class="choice">
              <input
                type="radio"
                id="package-basic"
                name="package"
                value="Basic"
                required
              >
              <label for="package-basic">Basic</label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="package-standard"
                name="package"
                value="Standard"
              >
              <label for="package-standard">Standard</label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="package-premium"
                name="package"
                value="Premium"
              >
              <label for="package-premium">Premium</label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="package-custom"
                name="package"
                value="Custom"
              >
              <label for="package-custom">Custom</label>
            </div>

          </div>
        </div>

        <!-- DELIVERY -->
        <div class="field">
          <label for="delivery">Delivery <span class="required">*</span></label>

          <select id="delivery" name="delivery" required>
            <option value="">Choose delivery method</option>
            <option value="Digital">Digital</option>
            <option value="Physical">Physical</option>
            <option value="Both">Digital + Physical</option>
          </select>
        </div>

        <!-- PHOTOS -->
        <div class="field">
          <label for="photos">Photos</label>

          <input
            id="photos"
            type="file"
            name="photos"
            accept="image/*"
            multiple
          >

          <small style="display:block;margin-top:8px;color:#888;">
            Add the photos you'd like to include in your MOMENTO.
          </small>
        </div>

        <!-- EXTRA MESSAGE -->
        <div class="field">
          <label for="message">Anything else?</label>

          <textarea
            id="message"
            name="message"
            placeholder="Tell us anything you'd like us to know..."
          ></textarea>
        </div>

        <button class="submit" type="submit">
          Submit request ✦
        </button>

      </form>

      <div class="success" id="success">
        <h2>Request received ✨</h2>

        <p>
          Your MOMENTO request has been received successfully.
          <br>
          We'll start working on your memory soon.
        </p>

        <a class="back" href="index.html">
          Back to MOMENTO
        </a>
      </div>

    </section>

  </main>

</body>
</html>
