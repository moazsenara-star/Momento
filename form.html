<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your MOMENTO</title>

  <script src="https://forminit.com/sdk/v1/forminit.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #f7eee3;
      --brown: #5a4032;
      --brown-dark: #3f2b22;
      --soft-brown: #8a6b58;
      --white: #fffaf4;
      --border: #ddcbbb;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, #f3dfca 0, transparent 35%),
        radial-gradient(circle at bottom right, #ead6c1 0, transparent 35%),
        var(--cream);
      color: var(--brown-dark);
      min-height: 100vh;
    }

    .container {
      width: min(720px, 92%);
      margin: auto;
      padding: 55px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 44px;
      letter-spacing: 6px;
      color: var(--brown-dark);
      margin-bottom: 12px;
    }

    .header p {
      color: var(--soft-brown);
      font-size: 15px;
      letter-spacing: .4px;
    }

    .card {
      background: rgba(255, 250, 244, .92);
      border: 1px solid rgba(221, 203, 187, .8);
      border-radius: 26px;
      padding: 34px;
      box-shadow: 0 22px 55px rgba(80, 54, 37, .12);
      backdrop-filter: blur(8px);
    }

    .field {
      margin-bottom: 24px;
    }

    label.title {
      display: block;
      color: var(--brown-dark);
      font-weight: bold;
      margin-bottom: 9px;
      font-size: 14px;
      letter-spacing: .3px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px 15px;
      font-family: inherit;
      font-size: 15px;
      color: var(--brown-dark);
      background: #fffdf9;
      outline: none;
      transition: .2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #a8917f;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--soft-brown);
      box-shadow: 0 0 0 3px rgba(138, 107, 88, .10);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .choice {
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: block;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      color: var(--brown);
      background: #fffdf9;
      font-size: 14px;
      transition: .2s ease;
    }

    .choice label:hover {
      border-color: var(--soft-brown);
      background: #fbf1e6;
    }

    .choice input:checked + label {
      background: var(--brown);
      color: #fffaf4;
      border-color: var(--brown);
    }

    .photos-note {
      display: block;
      margin-top: 8px;
      color: var(--soft-brown);
      font-size: 12px;
      line-height: 1.5;
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 17px;
      background: var(--brown);
      color: var(--white);
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      transition: .2s ease;
    }

    .submit:hover {
      background: var(--brown-dark);
      transform: translateY(-1px);
    }

    .submit:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    .success {
      display: none;
      text-align: center;
      padding: 45px 15px;
    }

    .success.active {
      display: block;
    }

    .success h2 {
      color: var(--brown-dark);
      font-size: 34px;
      margin-bottom: 16px;
    }

    .success p {
      color: var(--soft-brown);
      line-height: 1.8;
      font-size: 15px;
    }

    .back {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--brown);
      color: var(--white);
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .error {
      display: none;
      color: #8a3f32;
      background: #f8e7e2;
      border: 1px solid #e5c2b9;
      border-radius: 11px;
      padding: 12px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer-note {
      text-align: center;
      margin-top: 22px;
      color: var(--soft-brown);
      font-size: 12px;
      opacity: .85;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 0;
      }

      .card {
        padding: 23px;
        border-radius: 21px;
      }

      .header h1 {
        font-size: 34px;
        letter-spacing: 5px;
      }

      .choices {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>MOMENTO</h1>
      <p>Create something made from your memories.</p>
    </header>

    <section class="card">

      <form id="momento-form" enctype="multipart/form-data">

        <!-- FOR -->
        <div class="field">
          <label class="title" for="for">For *</label>

          <input
            id="for"
            type="text"
            name="fi-text-for"
            placeholder="Who is this MOMENTO for?"
            required
          >
        </div>

        <!-- FROM -->
        <div class="field">
          <label class="title" for="from">From *</label>

          <input
            id="from"
            type="text"
            name="fi-text-from"
            placeholder="Who is it from?"
            required
          >
        </div>

        <!-- WHATSAPP NUMBER -->
        <div class="field">
          <label class="title" for="whatsapp">WhatsApp Number *</label>

          <input
            id="whatsapp"
            type="tel"
            name="fi-phone-whatsapp"
            placeholder="Enter your WhatsApp number"
            autocomplete="tel"
            required
          >
        </div>

        <!-- OCCASION -->
        <div class="field">
          <label class="title" for="occasion">Occasion *</label>

          <select
            id="occasion"
            name="fi-select-occasion"
            required
          >
            <option value="">Choose an occasion</option>
            <option value="Birthday">Birthday</option>
            <option value="Anniversary">Anniversary</option>
            <option value="Friendship">Friendship</option>
            <option value="Graduation">Graduation</option>
            <option value="Just Because">Just Because</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- VIBE -->
        <div class="field">
          <label class="title">Vibe *</label>

          <div class="choices">

            <div class="choice">
              <input
                id="vibe-soft"
                type="radio"
                name="fi-radio-vibe"
                value="Soft & Romantic"
                required
              >
              <label for="vibe-soft">Soft & Romantic</label>
            </div>

            <div class="choice">
              <input
                id="vibe-fun"
                type="radio"
                name="fi-radio-vibe"
                value="Fun & Playful"
              >
              <label for="vibe-fun">Fun & Playful</label>
            </div>

            <div class="choice">
              <input
                id="vibe-nostalgic"
                type="radio"
                name="fi-radio-vibe"
                value="Nostalgic"
              >
              <label for="vibe-nostalgic">Nostalgic</label>
            </div>

            <div class="choice">
              <input
                id="vibe-minimal"
                type="radio"
                name="fi-radio-vibe"
                value="Minimal & Elegant"
              >
              <label for="vibe-minimal">Minimal & Elegant</label>
            </div>

          </div>
        </div>

        <!-- PACKAGE -->
        <div class="field">
          <label class="title">Package *</label>

          <div class="choices">

            <div class="choice">
              <input
                id="package-basic"
                type="radio"
                name="fi-radio-package"
                value="Basic"
                required
              >
              <label for="package-basic">Basic</label>
            </div>

            <div class="choice">
              <input
                id="package-standard"
                type="radio"
                name="fi-radio-package"
                value="Standard"
              >
              <label for="package-standard">Standard</label>
            </div>

            <div class="choice">
              <input
                id="package-premium"
                type="radio"
                name="fi-radio-package"
                value="Premium"
              >
              <label for="package-premium">Premium</label>
            </div>

          </div>
        </div>

        <!-- PHOTOS -->
        <div class="field">
          <label class="title" for="photos">Photos *</label>

          <input
            id="photos"
            type="file"
            name="fi-file-photos[]"
            accept="image/*"
            multiple
            required
          >

          <small class="photos-note">
            Choose the photos you'd like to include in your MOMENTO.
          </small>
        </div>

        <!-- EXTRA MESSAGE -->
        <div class="field">
          <label class="title" for="message">Anything else?</label>

          <textarea
            id="message"
            name="fi-text-message"
            placeholder="Tell us anything you'd like us to know..."
          ></textarea>
        </div>

        <button
          class="submit"
          id="submit-button"
          type="submit"
        >
          Submit request ✦
        </button>

        <div
          class="error"
          id="error-message"
        ></div>

      </form>

      <!-- SUCCESS -->
      <div
        class="success"
        id="success"
      >

        <h2>Request received ✨</h2>

        <p>
          Your MOMENTO request has been received successfully.
          <br>
          We'll start working on your memory soon.
        </p>

        <a
          class="back"
          href="index.html"
        >
          Back to MOMENTO
        </a>

      </div>

    </section>

    <p class="footer-note">
      Made with memories ✦
    </p>

  </main>

  <script>
    const forminit = new Forminit();
    const FORM_ID = "6qmuru0tvu8";

    const form = document.getElementById("momento-form");
    const button = document.getElementById("submit-button");
    const success = document.getElementById("success");
    const errorMessage = document.getElementById("error-message");

    form.addEventListener("submit", async function (e) {

      e.preventDefault();

      button.disabled = true;
      button.textContent = "Sending…";
      errorMessage.style.display = "none";

      try {

        const formData = new FormData(form);

        const result = await forminit.submit(
          FORM_ID,
          formData
        );

        if (result.error) {
          throw new Error(result.error.message);
        }

        form.style.display = "none";
        success.classList.add("active");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      } catch (error) {

        button.disabled = false;
        button.textContent = "Submit request ✦";

        errorMessage.textContent =
          error.message ||
          "Something went wrong. Please try again.";

        errorMessage.style.display = "block";
      }

    });
  </script>

</body>
              </html>
